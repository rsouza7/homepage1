<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,sans-serif;
}

body{
    background:#121212;
    color:#fff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:min(90%,500px);
    text-align:center;
}

h1{
    font-size:3rem;
    font-weight:300;
    margin-bottom:30px;
    letter-spacing:2px;
}

.search{
    display:flex;
    background:#1f1f1f;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(255,255,255,.04);
}

.search input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    padding:18px;
    font-size:1rem;
}

.search button{
    border:none;
    background:#d4af37;
    color:#111;
    padding:0 25px;
    cursor:pointer;
    font-weight:bold;
}

.links{
    margin-top:35px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.link{
    background:#1f1f1f;
    border-radius:15px;
    padding:15px;
    text-decoration:none;
    color:white;
    transition:.2s;
}

.link:hover{
    transform:translateY(-3px);
    background:#292929;
}
</style>
</head>

<body>

<div class="container">

    <h1>Lucas</h1>

    <form class="search"
    action="https://www.google.com/search"
    method="GET">

        <input
        type="text"
        name="q"
        placeholder="Pesquisar no Google...">

        <button>Buscar</button>

    </form>

    <div class="links">
        <a class="link" href="https://youtube.com">YouTube</a>
        <a class="link" href="https://github.com">GitHub</a>
        <a class="link" href="https://reddit.com">Reddit</a>
        <a class="link" href="https://chatgpt.com">ChatGPT</a>
    </div>

</div>

</body>
  </html>
