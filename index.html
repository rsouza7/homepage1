<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pesquisa {
            width: 90%;
            max-width: 600px;
        }

        .pesquisa input {
            width: 100%;
            padding: 18px 25px;
            border: none;
            border-radius: 20px;
            background-color: #1f1f1f;
            color: white;
            font-size: 18px;
            outline: none;
        }

        .pesquisa input::placeholder {
            color: #8a8a8a;
        }
    </style>
</head>

<body>

    <form class="pesquisa"
          action="https://www.google.com/search"
          method="GET">

        <input
            type="text"
            name="q"
            placeholder="Pesquisar no Google..."
            autocomplete="off"
            autofocus>
    </form>

</body>
</html>
